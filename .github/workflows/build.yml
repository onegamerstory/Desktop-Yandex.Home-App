name: Build Desktop App Installers (CI)

on:
  push:
    # Рабочий процесс запускается ТОЛЬКО при пуше тега, соответствующего паттерну vX.Y.Z
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    # Добавление разрешений для GH_TOKEN
    permissions:
      contents: write
      packages: write
      
    # Используем матрицу, чтобы запустить одни и те же шаги на разных ОС
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            name: macos-x64
            build_args: --mac dmg --x64
          - os: macos-14
            name: macos-arm64
            build_args: --mac dmg --arm64
          - os: ubuntu-latest
            name: linux
            build_args: --linux
          - os: windows-latest
            name: windows
            build_args: --win
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 
          
      # --- Кэширование папки node_modules (для ускорения) ---
      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ matrix.name }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.name }}-node-
            
      # ----------------------------------------------------------------------
      # Установка в два этапа для стабильности
      # ----------------------------------------------------------------------
      - name: Install Dependencies (Non-Native)
        # Установка ВСЕХ зависимостей (включая нативные, но без их сборки)
        run: npm install --ignore-scripts --unsafe-perm --timing --no-progress
        
      - name: Rebuild Native Modules (for Electron stability)
        # Использование официального инструмента electron-builder для корректной пересборки keytar
        run: npx electron-builder install-app-deps
        
      # ----------------------------------------------------------------------
      # Шаг сборки для всех платформ
      # ----------------------------------------------------------------------
      - name: Build Electron App (Dist)
        # Используем "--publish never", чтобы полностью отключить публикацию electron-builder 
        # Флаг "--" необходим для передачи аргументов в скрипт npm.
        run: npm run build

      - name: Build Electron App Installer
        run: npx electron-builder ${{ matrix.build_args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Отключает автопоиск сертификатов для подписи, который не нужен в CI.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        
      # ----------------------------------------------------------------------
      # Загрузка артефактов (для job release ниже)
      # ----------------------------------------------------------------------
      - name: Upload Artifacts (Windows, Mac, Linux)
        uses: actions/upload-artifact@v4
        with:
          # Используем имя файла, соответствующее ОС для легкой идентификации
          name: ${{ matrix.name }}-build-artifacts
          # Папка, указанная в вашем package.json
          path: release/
          retention-days: 7

  # После сборки на всех ОС — создаём GitHub Release и прикрепляем установщики.
  # Ручной "Create release" из тега даёт только source zip/tar — без этого job.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
